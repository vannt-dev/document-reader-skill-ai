name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the oldest version the skill supports.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install openpyxl pypdf pdfplumber pytest
      # The OCR tests that need the real program run where it is one command
      # to install; on Windows they are skipped and the rest of the OCR
      # tests run against a stand-in.
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Run tests
        working-directory: document-reader-skill
        run: python -B -m pytest tests -p no:cacheprovider -v

  scripts:
    name: setup script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check POSIX setup scripts parse
        run: |
          sh -n setup-document-reader.sh
          sh -n setup-python-env.sh
          sh -n setup-ocr.sh
